name: Refresh voting data

# Wekelijks de stemdata verversen + handmatig te starten.
# De Statenvergadering (met de stemmingen) is vrijwel altijd op woensdag, dus we
# verversen donderdagochtend — de dag erna — zodat nieuwe stemmingen snel meegenomen worden.
on:
  schedule:
    - cron: "0 6 * * 4"   # elke donderdag 06:00 UTC (~08:00 NL)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # collect.py exits 1 when a live scope loses data (a source broke, or started returning a
      # fraction of its votes). We do NOT want that to skip the commit below: the scopes that DID
      # refresh should still land, and the broken one keeps its previous data file either way.
      # So: record the outcome here, commit, then fail the job at the end.
      - name: Run collector
        id: collect
        continue-on-error: true
        run: python collector/collect.py

      # The push is retried: on 2026-11-05 GitHub rejected it with a server-side
      # "fatal error in commit_refs_rules" and a 1h40m run's data was thrown away. A rebase also
      # covers the ordinary case where the local Notubiz refresher pushed while this run was going.
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: refresh voting data"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing on origin/main and retrying in ${attempt}0s."
            git pull --rebase --autostash || { git rebase --abort || true; }
            sleep ${attempt}0
          done
          echo "::error title=Push failed::Collected data could not be pushed after 5 attempts."
          exit 1

      # Turns a silent degradation into a red run — which is what actually sends the notification
      # e-mail. Between 2026-06 and 2026-09 five provinces vanished from the site while this
      # workflow reported success every week; see coverage.md § Status van de bronnen.
      - name: Fail if a source lost data
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error title=Source regression::A source lost data this run. See the collector log above (search for REGRESSION) and coverage.md § Status van de bronnen."
          exit 1
